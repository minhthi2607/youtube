spring.application.name=youtube

# --- Database (MySQL) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:youtube_clone}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# Schema is owned by schema.sql (see below), Hibernate only validates entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- SQL migration (schema.sql-based, see src/main/resources/schema.sql) ---
spring.sql.init.mode=always
spring.sql.init.platform=mysql
spring.sql.init.continue-on-error=false

# --- File upload ---
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# --- Local video storage (dev only, see FileStorageService) ---
app.storage.location=${STORAGE_LOCATION:uploads}

# --- JWT ---
# Override app.jwt.secret via env var in any non-dev environment. Must be >= 32 bytes.
app.jwt.secret=${JWT_SECRET:dev-only-please-change-this-secret-value-32bytes+}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
