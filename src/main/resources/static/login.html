<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - YouTube Clone</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/index.html">YouTube Clone</a>
  </header>

  <main>
    <form class="auth-form" id="login-form">
      <h1>Log in</h1>
      <div class="error-box" id="error-box"></div>

      <label for="usernameOrEmail">Username or email</label>
      <input id="usernameOrEmail" name="usernameOrEmail" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>

      <button class="btn primary" type="submit">Log in</button>
      <p style="margin-top:16px; font-size:14px; color:#aaa;">
        No account yet? <a href="/register.html" style="color:#3ea6ff;">Sign up</a>
      </p>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
