<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up - YouTube Clone</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/index.html">YouTube Clone</a>
  </header>

  <main>
    <form class="auth-form" id="register-form">
      <h1>Create your account</h1>
      <div class="error-box" id="error-box"></div>

      <label for="displayName">Display name</label>
      <input id="displayName" name="displayName" required maxlength="100">

      <label for="username">Username</label>
      <input id="username" name="username" required minlength="3" maxlength="50" pattern="[a-zA-Z0-9_.]+">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8">

      <button class="btn primary" type="submit">Sign up</button>
      <p style="margin-top:16px; font-size:14px; color:#aaa;">
        Already have an account? <a href="/login.html" style="color:#3ea6ff;">Log in</a>
      </p>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
